# AI Translate for Telegram - the desktop app, built for the three systems.
#
# In the same spirit as the checks: no ready-made actions, only what every
# GitHub runner already has, git, node, cargo and gh. Each system builds the
# app from this commit with the Tauri command line that package.json pins.
#
# A push that touches desktop/, or a run from Actions > Desktop > Run
# workflow, builds and stops there: it says whether the app still builds.
# On Linux it also starts the app and lets it load the real Telegram Web up
# to the sign-in screen (test/app.mjs).
#
# A tag, v and package.json's version (v0.2.3a), makes a release as well: a
# draft, with every installer attached. Publishing the draft is a person's
# act, after trying the installers (docs/test-plan.md). Once it is the latest
# release, installed apps update themselves from its latest.json.
#
# That needs one secret, under Settings > Secrets and variables > Actions:
# TAURI_SIGNING_PRIVATE_KEY, the updater's own key, whose public half is in
# desktop/src-tauri/tauri.conf.json. Without it the installers are still
# built and attached, with no latest.json: nothing would update from them.
# The installers themselves are not code-signed for Windows or macOS; the
# README says what a person sees the first time because of that.

name: Desktop

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A tag only: the draft the installers are attached to.
  draft:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Fetch the version this tag should carry
        run: |
          git init -q .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY"
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD

      - name: Open the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::The tag is $GITHUB_REF_NAME and package.json says $version: the tag has to be v$version."
              exit 1
          fi

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              echo "A release for $GITHUB_REF_NAME is there already; its files are replaced."
          else
              gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
                  --title "AI Translate $version" \
                  --notes "The desktop app, for Windows, macOS and Linux. Unofficial. The builds are not signed: the README says what to press the first time."
          fi

  build:
    needs: draft
    # Without a tag there is no draft, and the build goes ahead all the same.
    if: always() && (needs.draft.result == 'success' || needs.draft.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: linux
            runner: ubuntu-22.04
            arguments: --bundles appimage,deb
          - system: windows
            runner: windows-latest
            arguments: --bundles nsis
          - system: macos
            runner: macos-latest
            arguments: --target universal-apple-darwin --bundles app,dmg
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Fetch the script and the core it pins
        run: |
          git init -q .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY"
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
          git submodule update -q --init --depth 1

      - name: What a webview app is built against on Linux
        if: matrix.system == 'linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
              libxdo-dev libssl-dev build-essential file patchelf xvfb xauth

      - name: Both kinds of Mac
        if: matrix.system == 'macos'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Install esbuild and the Tauri command line, and build the script
        run: |
          npm ci --no-audit --no-fund
          node build.mjs

      - name: The app, started for real, up to Telegram's sign-in screen
        if: matrix.system == 'linux'
        run: REQUIRE_APP=1 node test/app.mjs

      - name: Build the app and its installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # linuxdeploy is an AppImage itself, and a runner has nothing to mount one with.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
              # Signed for the updater: a .sig beside each installer.
              echo '{ "bundle": { "createUpdaterArtifacts": true } }' > "$RUNNER_TEMP/signed.json"
              npx tauri build ${{ matrix.arguments }} --config "$RUNNER_TEMP/signed.json"
          else
              echo "::warning::No TAURI_SIGNING_PRIVATE_KEY: the installers are built, and nothing can update from them."
              unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
              npx tauri build ${{ matrix.arguments }}
          fi

      - name: Name the installers, and say what was built
        run: node desktop/collect.mjs "$RUNNER_TEMP/installers"

      - name: Attach them to the draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP"/installers/* --repo "$GITHUB_REPOSITORY" --clobber

  # A tag only, and only once all three systems are in: what the updater reads.
  latest:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Fetch what writes latest.json
        run: |
          git init -q .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY"
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD

      - name: Write latest.json from the signatures, and attach it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir signatures
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "*.sig" --dir signatures || true

          if node desktop/latest.mjs "$GITHUB_REF_NAME" signatures > latest.json; then
              cat latest.json
              gh release upload "$GITHUB_REF_NAME" latest.json --repo "$GITHUB_REPOSITORY" --clobber
          else
              echo "::warning::No signed installer in this release, so no latest.json: installed apps will not update to it."
          fi

          echo "The release is a draft. Try the installers, then publish it: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases"
