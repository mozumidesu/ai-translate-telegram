# AI Translate for Telegram - the checks that run on every push.
#
# In the same spirit as ai-translate's own workflows: no ready-made actions,
# only git, node and npm. The core comes from the submodule at the commit
# this repository pins, and Playwright's Chromium runs the built script in
# pages shaped like both clients. test/live.mjs, which opens the real
# web.telegram.org, is not run here: it is for a person, after a client moved.

name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch the script and the core it pins
        run: |
          git init -q .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY"
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
          git submodule update -q --init --depth 1

      - name: Install esbuild and Playwright's Chromium
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Formatting on its way to the model and back
        run: node test/formatted.mjs

      - name: Web A's worker line, against its calls
        run: node test/weba.mjs

      - name: Web K's manager line, against its calls
        run: node test/webk.mjs

      - name: Whether the defaults still match the plugin's
        run: node test/defaults.mjs

      - name: Every word, in sixteen languages, and the header
        run: node test/strings.mjs

      - name: Whether dist/ is what the sources build
        run: node test/dist.mjs

      - name: The built script in pages shaped like both clients
        run: REQUIRE_BROWSER=1 node test/page.mjs
